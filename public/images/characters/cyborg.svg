<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCyborg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a2e"/>
      <stop offset="50%" stop-color="#08070c"/>
      <stop offset="100%" stop-color="#1a000d"/>
    </linearGradient>
    <linearGradient id="cyberMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <filter id="cyberEyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="650" fill="url(#bgCyborg)"/>

  <!-- Cyber Circuit Background Lines -->
  <g stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 50,100 L 150,100 L 200,180 L 200,300"/>
    <circle cx="50" cy="100" r="4" fill="#00e5ff"/>
    <path d="M 450,100 L 350,100 L 300,180 L 300,300"/>
    <circle cx="450" cy="100" r="4" fill="#00e5ff"/>
    <path d="M 100,500 L 200,500 L 250,450"/>
    <path d="M 400,500 L 300,500 L 250,450"/>
  </g>

  <!-- Left Side: Classic Red Mask Half -->
  <path d="M 250,90 C 150,90 120,170 120,290 C 120,410 180,510 250,540 L 250,90 Z" fill="url(#cyberRed)" stroke="#660000" stroke-width="3"/>

  <!-- Right Side: Cybernetic Metallic Half -->
  <path d="M 250,90 C 350,90 380,170 380,290 C 380,410 320,510 250,540 L 250,90 Z" fill="url(#cyberMetal)" stroke="#263238" stroke-width="3"/>

  <!-- Center Metallic Seam with Screws -->
  <line x1="250" y1="90" x2="250" y2="540" stroke="#00e5ff" stroke-width="4"/>
  <circle cx="250" cy="140" r="4" fill="#ffffff"/>
  <circle cx="250" cy="220" r="4" fill="#ffffff"/>
  <circle cx="250" cy="380" r="4" fill="#ffffff"/>
  <circle cx="250" cy="460" r="4" fill="#ffffff"/>

  <!-- Left Eye: Classic Spider Lens -->
  <path d="M 235,275 C 200,240 145,245 138,285 C 130,330 185,380 232,342 Z" fill="#0a0a0a" stroke="#111" stroke-width="6"/>
  <path d="M 230,278 C 198,248 152,252 146,286 C 139,324 188,368 227,337 Z" fill="#ffffff" filter="url(#cyberEyeGlow)"/>

  <!-- Right Eye: Glowing Cybernetic Laser Target Eye -->
  <circle cx="310" cy="300" r="42" fill="#111" stroke="#00e5ff" stroke-width="6"/>
  <circle cx="310" cy="300" r="30" fill="#00e5ff" filter="url(#cyberEyeGlow)"/>
  <circle cx="310" cy="300" r="14" fill="#ffffff"/>
  <!-- Target Crosshairs -->
  <line x1="260" y1="300" x2="360" y2="300" stroke="#ff0055" stroke-width="2"/>
  <line x1="310" y1="250" x2="310" y2="350" stroke="#ff0055" stroke-width="2"/>

  <!-- Title Badge -->
  <text x="250" y="590" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">CYBORG SPIDER-MAN</text>
  <text x="250" y="615" font-family="monospace" font-size="14" fill="#00e5ff" text-anchor="middle" letter-spacing="4">EARTH-15</text>
</svg>
