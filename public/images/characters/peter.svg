<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a21"/>
      <stop offset="50%" stop-color="#08070c"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
    <linearGradient id="suitRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e6f2ff"/>
      <stop offset="100%" stop-color="#99ccff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="650" fill="url(#bgGrad)"/>
  
  <!-- Web Background Lines -->
  <g stroke="#ff3333" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <line x1="250" y1="0" x2="0" y2="650"/>
    <line x1="250" y1="0" x2="125" y2="650"/>
    <line x1="250" y1="0" x2="250" y2="650"/>
    <line x1="250" y1="0" x2="375" y2="650"/>
    <line x1="250" y1="0" x2="500" y2="650"/>
    <ellipse cx="250" cy="180" rx="100" ry="70"/>
    <ellipse cx="250" cy="180" rx="180" ry="120"/>
    <ellipse cx="250" cy="180" rx="260" ry="170"/>
  </g>

  <!-- Head Base Shape (Classic Red Suit Mask) -->
  <path d="M 250,90 C 150,90 120,170 120,290 C 120,410 180,510 250,540 C 320,510 380,410 380,290 C 380,170 350,90 250,90 Z" fill="url(#suitRed)" stroke="#800000" stroke-width="4"/>

  <!-- Suit Web Pattern on Face -->
  <g stroke="#1a0000" stroke-width="2.5" fill="none" opacity="0.75">
    <!-- Center vertical -->
    <line x1="250" y1="90" x2="250" y2="540"/>
    <!-- Radiating web lines from bridge of nose (250, 290) -->
    <line x1="250" y1="290" x2="150" y2="105"/>
    <line x1="250" y1="290" x2="200" y2="95"/>
    <line x1="250" y1="290" x2="300" y2="95"/>
    <line x1="250" y1="290" x2="350" y2="105"/>
    <line x1="250" y1="290" x2="122" y2="220"/>
    <line x1="250" y1="290" x2="378" y2="220"/>
    <line x1="250" y1="290" x2="125" y2="360"/>
    <line x1="250" y1="290" x2="375" y2="360"/>
    <line x1="250" y1="290" x2="160" y2="480"/>
    <line x1="250" y1="290" x2="340" y2="480"/>

    <!-- Concentric Web Loops -->
    <path d="M 210,135 Q 250,150 290,135"/>
    <path d="M 180,185 Q 250,210 320,185"/>
    <path d="M 150,245 Q 250,275 350,245"/>
    <path d="M 155,340 Q 250,380 345,340"/>
    <path d="M 175,415 Q 250,455 325,415"/>
    <path d="M 205,480 Q 250,510 295,480"/>
  </g>

  <!-- Left Eye Lens Frame (Outer Black Border) -->
  <path d="M 235,275 C 200,240 145,245 138,285 C 130,330 185,380 232,342 Z" fill="#0d0d0d" stroke="#000" stroke-width="6"/>
  <!-- Left Eye Lens Inner White -->
  <path d="M 230,278 C 198,248 152,252 146,286 C 139,324 188,368 227,337 Z" fill="url(#lensGrad)" filter="url(#eyeGlow)"/>

  <!-- Right Eye Lens Frame (Outer Black Border) -->
  <path d="M 265,275 C 300,240 355,245 362,285 C 370,330 315,380 268,342 Z" fill="#0d0d0d" stroke="#000" stroke-width="6"/>
  <!-- Right Eye Lens Inner White -->
  <path d="M 270,278 C 302,248 348,252 354,286 C 361,324 312,368 273,337 Z" fill="url(#lensGrad)" filter="url(#eyeGlow)"/>

  <!-- Title Badge -->
  <text x="250" y="595" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">PETER B. PARKER</text>
  <text x="250" y="620" font-family="monospace" font-size="14" fill="#ff4444" text-anchor="middle" letter-spacing="4">EARTH-616</text>
</svg>
